  <body>
    <noscript>
      <h1>QuickDaw</h1>
      <p>A multitrack recorder that starts 30 seconds ago.</p>
      <p>A multitrack recorder that runs entirely in a browser tab. Pick an audio interface and you get one track per input, mapped 1:1, streamed straight to a folder on disk as mono WAVs. A pre-roll buffer is always holding every input as it arrives, so pressing record puts the previous 30 seconds at the head of the take. If a disk stalls, the lost frames are padded with silence and logged in the take's manifest, so a gap costs you content but never time. There's also a generated test signal to check the whole chain without an interface, with a 1 kHz reference at exactly -18 dBFS.</p>
      <p>QuickDaw runs in the browser and needs JavaScript.</p>
      <ul>
        <li><a href="https://stoatworks-labs.com/software/quickdaw/">QuickDaw on stoatworks-labs.com</a></li>
        <li><a href="https://github.com/stoatworks-labs/quickdaw">Source on GitHub</a></li>
        <li><a href="https://stoatworks-labs.com/web-tools/self-hosting/">Running it on your own server</a></li>
      </ul>
    </noscript>
