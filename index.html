<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Multitrack audio recorder in the browser: one track per interface input, a continuous pre-roll buffer, and takes streamed straight to a folder as WAV."
    />
    <title>QuickDaw — multitrack recorder</title>
    <link rel="canonical" href="https://quickdaw.stoatworks-labs.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Stoatworks Labs" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:url" content="https://quickdaw.stoatworks-labs.com/" />
    <meta property="og:title" content="QuickDaw — multitrack recorder" />
    <meta
      property="og:description"
      content="Multitrack audio recorder in the browser: one track per interface input, a continuous pre-roll buffer, and takes streamed straight to a folder as WAV."
    />
    <!-- Card hosted on the main site: it is regenerated in place by the
         website's make_thumbnails.py and keeps its filename, so a copy
         vendored here would go stale without anything saying so. -->
    <meta property="og:image" content="https://stoatworks-labs.com/thumbs/quickdaw.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />
    <meta property="og:image:alt" content="QuickDaw — multitrack recorder" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://stoatworks-labs.com/thumbs/quickdaw.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS ignores the manifest's icons and wants a PNG of its own. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#08090b" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#08090b" media="(prefers-color-scheme: dark)" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      About dialog. Both files are vendored from stoatworks-backend/about and
      generated by its sync-about.py — edit them there, never here. Classic +
      defer like the support footer: about-data.js only sets defaults, so it and
      the app's own startup can load in either order.
    -->
    <script src="/about-data.js" defer></script>
    <script src="/about.js" defer></script>
    <!--
      Support footer. Vendored from stoatworks-backend/support-footer — edit it
      there and re-sync, never here. Classic + defer on purpose: it reads its
      config off this tag, and document.currentScript is null inside a module.
    -->
    <script
      src="/support-footer.js"
      defer
      data-app="QuickDaw"
      data-repo="https://github.com/stoatworks-labs/quickdaw"
      data-note="It runs entirely in your browser — the audio goes from the interface to the folder you chose and never leaves your machine."
    ></script>
  </body>
</html>
