<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="QuickDaw">
  <rect width="32" height="32" rx="5" fill="#0e1116"/>
  <!-- Four tracks running left to right, the leftmost dimmed: that part is the
       pre-roll, already captured before the take began. The record dot sits
       where the button was pressed, not at the start of the audio. -->
  <g fill="#5b9dd9">
    <rect x="4" y="6"  width="7" height="3" rx="1.5" opacity=".38"/>
    <rect x="4" y="12" width="7" height="3" rx="1.5" opacity=".38"/>
    <rect x="4" y="18" width="7" height="3" rx="1.5" opacity=".38"/>
    <rect x="4" y="24" width="7" height="3" rx="1.5" opacity=".38"/>
    <rect x="11" y="6"  width="17" height="3" rx="1.5"/>
    <rect x="11" y="12" width="13" height="3" rx="1.5"/>
    <rect x="11" y="18" width="19" height="3" rx="1.5" opacity=".8"/>
    <rect x="11" y="24" width="10" height="3" rx="1.5" opacity=".62"/>
  </g>
  <rect x="10" y="3" width="2" height="26" rx="1" fill="#d1453b"/>
</svg>
