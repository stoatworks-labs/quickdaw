# Generated from public/_headers in quickdaw by stoatworks-unraid/scripts/gen-docker.mjs.
# Edit that file and regenerate — changes made here are overwritten.
#
# Included by every location block in nginx.conf. It has to be included rather
# than inherited: a location that sets any add_header of its own replaces the
# server-level list entirely instead of adding to it.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), display-capture=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; font-src 'self' data:; connect-src 'self' https://intake.stoatworks-labs.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
